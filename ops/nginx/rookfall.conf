# Хостовый nginx → контейнер Rookfall. Скопировать в /etc/nginx/sites-available/rookfall,
# заменить rookfall.example.com на свой домен, включить симлинком в sites-enabled.
# TLS и редирект 80→443 допишет certbot --nginx (DEPLOY.md §1).
server {
    listen 80;
    server_name rookfall.example.com;

    # Node ничего не сжимает — сжимает nginx: бандл three.js и glTF-модели (~12 МБ
    # JSON с base64) ужимаются в разы
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json model/gltf+json image/svg+xml;

    # Клиент (index.html, /assets, /models) и /api
    location / {
        proxy_pass http://127.0.0.1:61873;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lockstep-WebSocket: апгрейд соединения и длинный таймаут — матч живёт
    # десятки минут, тишины в канале нет (тики 20 Гц), но запас не помешает
    location /ws {
        proxy_pass http://127.0.0.1:61873;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
