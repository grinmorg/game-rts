name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Determinism gate (PRD §7.8): sim + replay + bot-vs-bot hashes must match on every commit
      - run: pnpm test:determinism
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bench

  # Автодеплой — выключен, пока в репозитории не задана переменная DEPLOY_ENABLED=true
  # и секреты DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PORT (DEPLOY.md §2).
  # Деплои не отменяем на середине: новые ждут в очереди.
  deploy:
    needs: [test]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            # сервер, поднятый ещё под именем Rookfall, остаётся в старом каталоге (DEPLOY.md §5)
            DIR=/var/www/pocket-of-empire
            if [ ! -d "$DIR" ] && [ -d /var/www/rookfall ]; then DIR=/var/www/rookfall; fi
            cd "$DIR"
            git fetch origin
            # Скрипт берём из разворачиваемого коммита, а не тот, что лежал на сервере с прошлого раза
            git checkout ${{ github.sha }} -- ops/deploy.sh
            ./ops/deploy.sh ${{ github.sha }}
